<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Z71 News</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --black:#050404;--black2:#0d0b08;--black3:#161310;--black4:#1e1a14;
  --gold:#c9912a;--gold2:#e4b44a;--gold3:#f0cc6e;--gold4:#f8e4a8;
  --gold-dim:#7a5718;--gold-faint:rgba(201,145,42,0.08);
  --rule:rgba(201,145,42,0.18);--rule2:rgba(201,145,42,0.38);
  --text:#e8dcc0;--text2:#b8a478;--text3:#7a6840;--text4:#4a3e28;
  --red:#8b2020;--red2:#c03030;
  --L:#3a7a3a;--ML:#2a5aaa;--C:#888;--MR:#a86000;--R:#8b2020;--ST:#6a3aaa;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--black);color:var(--text);font-family:'Crimson Pro',Georgia,serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background:
    radial-gradient(circle at 50% 0%,rgba(201,145,42,0.06) 0%,transparent 50%),
    repeating-radial-gradient(circle at 50% 50%,transparent 0,transparent 55px,rgba(201,145,42,0.02) 56px,transparent 57px);
  pointer-events:none;z-index:0}

/* MASTHEAD */
.masthead{position:sticky;top:0;z-index:10;background:var(–black);border-bottom:1px solid var(–rule2)}
.mhd-ring{height:2px;background:linear-gradient(to right,transparent,var(–gold-dim) 20%,var(–gold2) 50%,var(–gold-dim) 80%,transparent)}
.mhd-inner{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem .55rem;gap:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.65rem}
.emblem{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,var(–black3) 35%,var(–black) 100%);border:1px solid var(–gold-dim);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.emblem::before{content:’’;position:absolute;inset:4px;border:1px solid rgba(201,145,42,0.2);border-radius:50%}
.emblem::after{content:’’;position:absolute;inset:8px;border:1px solid rgba(201,145,42,0.07);border-radius:50%}
.emblem-z{font-family:‘Cinzel’,serif;font-size:1.05rem;font-weight:900;color:var(–gold2)}
.brand-text h1{font-family:‘Cinzel’,serif;font-size:.82rem;font-weight:600;color:var(–gold3);letter-spacing:.14em}
.brand-text p{font-family:‘Share Tech Mono’,monospace;font-size:7px;color:var(–text4);letter-spacing:.12em;margin-top:1px}
.mhd-meta{text-align:right}
.mhd-date{font-family:‘Share Tech Mono’,monospace;font-size:8px;color:var(–text3);letter-spacing:.08em}
.mhd-tagline{font-family:‘Crimson Pro’,serif;font-size:.75rem;font-style:italic;color:var(–text4)}
.mhd-ring-b{height:1px;background:linear-gradient(to right,transparent,var(–rule),var(–gold-dim),var(–rule),transparent)}

/* BIAS LEGEND */
.bias-legend{display:flex;background:var(–black2);border-bottom:1px solid var(–rule);overflow-x:auto}
.bl-item{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;padding:.35rem .5rem;font-family:‘Share Tech Mono’,monospace;font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(–text4);border-right:1px solid var(–rule);white-space:nowrap}
.bl-item:last-child{border-right:none}
.bl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* FEED */
.feed{max-width:640px;margin:0 auto;padding:.5rem 1rem 4rem;position:relative;z-index:1}

/* ARTICLE */
.item{display:grid;grid-template-columns:60px 1fr;border-bottom:1px solid var(–rule);text-decoration:none;color:inherit;padding:.85rem 0;transition:background .1s;position:relative}
.item:hover{background:var(–gold-faint)}
.item.hit{background:rgba(139,32,32,0.05)}
.item.hit::before{content:’’;position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(–red2),var(–red))}

/* BADGE */
.badge-col{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:.1rem}
.badge-src{font-family:‘Share Tech Mono’,monospace;font-size:9px;font-weight:500;padding:3px 5px;border:1px solid;border-radius:1px;text-align:center;line-height:1.2;letter-spacing:.03em;text-transform:uppercase;max-width:52px;word-break:break-all}
.badge-bias-pill{font-family:‘Share Tech Mono’,monospace;font-size:7px;padding:1px 5px;border-radius:8px;border:1px solid;text-align:center;letter-spacing:.05em}
.badge-time{font-family:‘Share Tech Mono’,monospace;font-size:7px;color:var(–gold-dim)}

/* CONTENT */
.item-content{padding-left:.75rem;border-left:1px solid var(–rule)}
.item-meta{font-family:‘Share Tech Mono’,monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(–text4);margin-bottom:.3rem;display:flex;align-items:center;gap:6px}
.item-meta-dot{width:3px;height:3px;border-radius:50%;background:var(–text4)}
.item-title{font-family:‘Crimson Pro’,serif;font-size:1.05rem;font-weight:600;color:var(–text);line-height:1.38}
.item.hit .item-title{color:var(–gold3)}
.item-kw{margin-top:.3rem;font-family:‘Share Tech Mono’,monospace;font-size:8px;color:var(–red2);letter-spacing:.07em}

/* SECTION BREAK */
.s-break{text-align:center;padding:.5rem 0;font-family:‘Share Tech Mono’,monospace;font-size:8px;color:var(–gold-dim);letter-spacing:.3em;border-bottom:1px solid var(–rule)}

/* FOOTER */
.foot{text-align:center;padding:1.5rem 1rem;font-family:‘Share Tech Mono’,monospace;font-size:7px;color:var(–text4);letter-spacing:.12em;position:relative;z-index:1}
.foot-rule{width:50%;margin:0 auto .5rem;height:1px;background:linear-gradient(to right,transparent,var(–gold-dim),transparent)}
.empty{padding:3rem 1rem;text-align:center;font-style:italic;color:var(–text3);font-size:.95rem}
</style>

</head>
<body>

<div class="masthead">
  <div class="mhd-ring"></div>
  <div class="mhd-inner">
    <div class="brand">
      <div class="emblem"><span class="emblem-z">Z</span></div>
      <div class="brand-text">
        <h1>Z71 NEWS</h1>
        <p>Global Intelligence Feed</p>
      </div>
    </div>
    <div class="mhd-meta">
      <div class="mhd-date" id="ts">@Zlatti_71</div>
      <div class="mhd-tagline">Pull the camera back.</div>
    </div>
  </div>
  <div class="mhd-ring-b"></div>
</div>

<div class="bias-legend">
  <div class="bl-item"><span class="bl-dot" style="background:var(--L)"></span>Left</div>
  <div class="bl-item"><span class="bl-dot" style="background:var(--ML)"></span>Centre-Left</div>
  <div class="bl-item"><span class="bl-dot" style="background:var(--C)"></span>Centre</div>
  <div class="bl-item"><span class="bl-dot" style="background:var(--MR)"></span>Centre-Right</div>
  <div class="bl-item"><span class="bl-dot" style="background:var(--R)"></span>Right</div>
  <div class="bl-item"><span class="bl-dot" style="background:var(--ST)"></span>State Media</div>
</div>

<div class="feed" id="feed">
  <div class="empty">Loading&hellip;</div>
</div>

<div class="foot">
  <div class="foot-rule"></div>
  Z71 GLOBAL NEWS FEED &mdash; FRAMING DIFFERS BY OUTLET &mdash; DRAW YOUR OWN CONCLUSIONS &mdash; @ZLATTI_71
</div>

<script>
var BC={
  L:{col:'#3a7a3a',label:'Left',pill:'rgba(58,122,58,0.25)'},
  ML:{col:'#2a5aaa',label:'Centre-Left',pill:'rgba(42,90,170,0.25)'},
  C:{col:'#888888',label:'Centre',pill:'rgba(136,136,136,0.2)'},
  MR:{col:'#a86000',label:'Centre-Right',pill:'rgba(168,96,0,0.25)'},
  R:{col:'#8b2020',label:'Right',pill:'rgba(139,32,32,0.25)'},
  ST:{col:'#6a3aaa',label:'State Media',pill:'rgba(106,58,170,0.25)'}
};

function fmt(d){
  if(!d)return'';
  try{
    var dt=new Date(d);if(isNaN(dt))return'';
    return('0'+dt.getDate()).slice(-2)+'.'+('0'+(dt.getMonth()+1)).slice(-2)
      +' '+('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
  }catch(e){return'';}
}

function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(arts){
  var feed=document.getElementById('feed');
  if(!arts||!arts.length){feed.innerHTML='<div class="empty">No articles. Open via widget.</div>';return;}

  var now=new Date();
  document.getElementById('ts').textContent=
    now.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'})
    +' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);

  var html='';
  arts.forEach(function(a,i){
    var bc=BC[a.bias]||{col:'#888',label:a.bias||'',pill:'rgba(136,136,136,0.2)'};
    var hit=!!a.hit;
    var kws=a.kws&&a.kws.length?a.kws:[];
    if(i>0&&i%10===0)html+='<div class="s-break">* * *</div>';
    html+='<a class="item'+(hit?' hit':'')+'" href="'+esc(a.link||'')+'" target="_blank">'
      +'<div class="badge-col">'
      +'<span class="badge-src" style="color:'+bc.col+';border-color:'+bc.col+'55">'+esc(a.src||'')+'</span>'
      +'<span class="badge-bias-pill" style="color:'+bc.col+';border-color:'+bc.col+'44;background:'+bc.pill+'">'+esc(bc.label)+'</span>'
      +'<span class="badge-time">'+fmt(a.date)+'</span>'
      +'</div>'
      +'<div class="item-content">'
      +'<div class="item-meta">'+esc(a.src||'')+'<span class="item-meta-dot"></span>'+esc(bc.label)+'</div>'
      +'<div class="item-title">'+esc(a.title||'')+'</div>'
      +(hit&&kws.length?'<div class="item-kw">> '+esc(kws.join(' / '))+'</div>':'')
      +'</div></a>';
  });
  feed.innerHTML=html;
}

try{
  var hash=window.location.hash;
  if(hash&&hash.length>1){
    var raw=hash.substring(1);
    var b64=raw.replace(/-/g,'+').replace(/_/g,'/');
    while(b64.length%4){b64+='=';}
    var uriJson=atob(b64);
    var json=decodeURIComponent(uriJson);
    render(JSON.parse(json));
  } else {
    document.getElementById('feed').innerHTML='<div class="empty">No data. Open via widget.</div>';
  }
}catch(e){
  document.getElementById('feed').innerHTML='<div class="empty">Error: '+esc(String(e.message||e))+'</div>';
}
</script>

</body>
</html>
